name: Route Matrix compatibility

on:
  push:
    branches: [feat/route-matrix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install frontend dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Frontend checks
        shell: pwsh
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run tests/components/RouteMatrixPanel.test.tsx tests/components/SwitchModePanel.test.tsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build:renderer
      - name: Read pinned Rust version
        id: rust
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern 'channel = "([^"]+)"').Matches[0].Groups[1].Value
          "channel=$channel" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          shared-key: route-matrix
      - name: Backend compile and HTTP integration tests
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib route_matrix:: -- --test-threads=1
